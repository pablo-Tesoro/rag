[project]
name = "bank-assistant"
version = "0.1.0"
description = "Agentic assistant for employees of Banco Olvessa (a fictitious bank): RAG over internal policies, core-banking lookups and human-approved incident creation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142,<1",
    "langchain>=1.4,<2",
    "langchain-core>=1.6,<2",
    "langchain-google-genai>=4.4,<5",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "pdfplumber>=0.11,<0.12",
    "psycopg-pool>=3.2,<4",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "pyyaml>=6.0,<7",
    "sentence-transformers>=6.1,<7",
    "snowballstemmer>=3.0,<4",
    # Direct dependency only so that [tool.uv.sources] can pin it to the CPU index.
    "torch>=2.8",
    "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "types-pyyaml>=6.0",
]
# Only needed to regenerate the fictitious PDFs in data/corpus (scripts/build_pdfs.py).
data = [
    "reportlab>=5.0,<6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

# CPU-only torch on Linux (Docker, CI): the default PyPI wheel bundles CUDA libraries
# (several GB) that this project never uses. macOS keeps the regular PyPI wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PTH",      # prefer pathlib
    "S",        # bandit (security)
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Spanish text legitimately contains accented/ambiguous chars
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are the point of tests
"scripts/**" = ["S311"]  # seeded pseudo-random data generation, not crypto

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts", "evals"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No type information shipped.
module = ["reportlab.*", "snowballstemmer"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs a running Postgres (make up); skipped when it is not reachable",
]
